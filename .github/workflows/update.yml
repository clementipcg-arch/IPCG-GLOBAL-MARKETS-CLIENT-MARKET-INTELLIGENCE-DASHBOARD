# Rebuilds and republishes the dashboard with fresh data. Free: GitHub Actions + Cloudflare Pages.
name: Update dashboard
on:
  schedule:
    - cron: '30 22 * * *'   # 06:30 SGT
    - cron: '30 4 * * *'    # 12:30 SGT
    - cron: '30 10 * * *'   # 18:30 SGT
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', 'server/**', 'config/**', 'scripts/**', 'briefings/published/**']
  workflow_call:
    inputs:
      ref: { type: string, default: main }
concurrency: { group: deploy, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests
        run: npm test
      - name: Fetch data and build site
        run: node scripts/build-static.js
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          ICE_BOFA_CLIENT_LICENCE: 'false'
      - name: Create Cloudflare Pages project (first run only)
        run: npx --yes wrangler@4 pages project create "${{ vars.CF_PAGES_PROJECT || 'ipcg-markets' }}" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist/site --project-name="${{ vars.CF_PAGES_PROJECT || 'ipcg-markets' }}" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
